<!-- Shared CSS for all preview cards -->
<style>
  :root {
    --brand-green: #1B4332;
    --brand-green-2: #2D6A4F;
    --brand-green-3: #52796F;
    --brand-green-4: #74A892;
    --brand-green-5: #95C4B0;
    --brand-gold: #B8960C;
    --bg: #FFFEFC;
    --bg-card: #ffffff;
    --bg-muted: #f5f5f0;
    --fg: #1a1a1a;
    --fg-muted: #737373;
    --border: #e8e8e3;
    --sidebar-bg: oklch(0.25 0.055 163.7);
    --sidebar-fg: oklch(0.92 0.010 163);
    --sidebar-accent-bg: oklch(0.32 0.060 163.7);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
  }
  .card-root {
    padding: 20px;
    min-height: 120px;
  }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .grid { display: grid; gap: 10px; }
  .eyebrow {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--brand-green);
  }
  .mono { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; }
  .tabular { font-variant-numeric: tabular-nums; }
  .muted { color: var(--fg-muted); }
  .swatch {
    width: 100%; border-radius: 6px; border: 1px solid rgba(0,0,0,0.04);
    aspect-ratio: 1.6 / 1;
    display: flex; align-items: flex-end; padding: 6px 8px;
    font-size: 10px; font-weight: 600;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 8px; font-size: 11px; font-weight: 500;
    border-radius: 9999px;
  }
  .dot { width: 6px; height: 6px; border-radius: 999px; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
