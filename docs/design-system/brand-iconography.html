<!doctype html><html><head><meta charset="utf-8"><title>Iconography</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body{margin:0;font-family:Inter,sans-serif;background:#FFFEFC;padding:20px;color:#1a1a1a;font-size:11px;}
  .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:14px 10px;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:4px;color:#1a1a1a;}
  .cell svg{width:20px;height:20px;stroke-width:2;color:#1B4332;}
  .cell code{font-size:10px;color:#737373;font-family:'Geist Mono',Menlo,monospace;}
  .eyebrow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#1B4332;margin:0 0 10px;}
</style></head><body>
<div class="eyebrow">lucide-react · default stroke 2 · sizes 3/3.5/4/5 (h-*)</div>
<div class="grid">
  <div class="cell"><i data-lucide="building-2"></i><code>building-2</code></div>
  <div class="cell"><i data-lucide="file-text"></i><code>file-text</code></div>
  <div class="cell"><i data-lucide="folder-kanban"></i><code>folder-kanban</code></div>
  <div class="cell"><i data-lucide="users"></i><code>users</code></div>
  <div class="cell"><i data-lucide="dollar-sign"></i><code>dollar-sign</code></div>
  <div class="cell"><i data-lucide="wallet"></i><code>wallet</code></div>
  <div class="cell"><i data-lucide="trending-up"></i><code>trending-up</code></div>
  <div class="cell"><i data-lucide="receipt"></i><code>receipt</code></div>
  <div class="cell"><i data-lucide="settings"></i><code>settings</code></div>
  <div class="cell"><i data-lucide="key"></i><code>key</code></div>
  <div class="cell"><i data-lucide="home"></i><code>home</code></div>
  <div class="cell"><i data-lucide="hard-hat"></i><code>hard-hat</code></div>
  <div class="cell"><i data-lucide="mountain"></i><code>mountain</code></div>
  <div class="cell"><i data-lucide="store"></i><code>store</code></div>
  <div class="cell"><i data-lucide="check-circle"></i><code>check-circle</code></div>
  <div class="cell"><i data-lucide="scroll-text"></i><code>scroll-text</code></div>
  <div class="cell"><i data-lucide="credit-card"></i><code>credit-card</code></div>
  <div class="cell"><i data-lucide="map-pin"></i><code>map-pin</code></div>
  <div class="cell"><i data-lucide="ruler"></i><code>ruler</code></div>
  <div class="cell"><i data-lucide="bed-double"></i><code>bed-double</code></div>
</div>
<script>lucide.createIcons();</script>
</body></html>
