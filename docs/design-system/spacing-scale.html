<!doctype html><html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:#FFFEFC;color:#1a1a1a;padding:20px;font-size:12px;}
  table{border-collapse:collapse;font-family:'Geist Mono',Menlo,monospace;font-size:11px;}
  td{padding:4px 10px;}
  .bar{background:#1B4332;height:10px;border-radius:2px;}
  .tok{color:#737373;width:40px;text-align:right;}
  .px{color:#1a1a1a;width:44px;}
  .use{color:#737373;font-family:Inter,sans-serif;}
</style></head><body>
<table>
  <tr><td class="tok">1</td><td class="px">4px</td><td><div class="bar" style="width:4px;"></div></td><td class="use">icon-label gap</td></tr>
  <tr><td class="tok">2</td><td class="px">8px</td><td><div class="bar" style="width:8px;"></div></td><td class="use">button gap, pill padding</td></tr>
  <tr><td class="tok">3</td><td class="px">12px</td><td><div class="bar" style="width:12px;"></div></td><td class="use">card inner padding-x</td></tr>
  <tr><td class="tok">4</td><td class="px">16px</td><td><div class="bar" style="width:16px;"></div></td><td class="use">page padding</td></tr>
  <tr><td class="tok">6</td><td class="px">24px</td><td><div class="bar" style="width:24px;"></div></td><td class="use">section rhythm</td></tr>
  <tr><td class="tok">8</td><td class="px">32px</td><td><div class="bar" style="width:32px;"></div></td><td class="use">page header margin</td></tr>
  <tr><td class="tok">12</td><td class="px">48px</td><td><div class="bar" style="width:48px;"></div></td><td class="use">major sections</td></tr>
</table>
</body></html>
