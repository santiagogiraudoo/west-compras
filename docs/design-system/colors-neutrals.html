<!doctype html><html><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:#FFFEFC;color:#1a1a1a;font-size:14px;padding:18px;}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
  .swatch{border-radius:6px;aspect-ratio:1.2/1;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-size:10px;font-weight:600;font-variant-numeric:tabular-nums;border:1px solid rgba(0,0,0,0.08);}
  .swatch .n{font-size:10px;opacity:0.7;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;}
</style></head><body>
<div class="grid">
  <div class="swatch" style="background:#FFFEFC"><span class="n">BG</span>#FFFEFC</div>
  <div class="swatch" style="background:#FFFFFF"><span class="n">Card</span>#FFFFFF</div>
  <div class="swatch" style="background:#F5F5F0"><span class="n">Muted</span>#F5F5F0</div>
  <div class="swatch" style="background:#E8E8E3"><span class="n">Border</span>#E8E8E3</div>
  <div class="swatch" style="background:#737373;color:#fff;"><span class="n">FG muted</span>#737373</div>
  <div class="swatch" style="background:#1A1A1A;color:#fff;"><span class="n">FG</span>#1A1A1A</div>
</div>
</body></html>
