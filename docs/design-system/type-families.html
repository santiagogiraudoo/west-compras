<!doctype html><html><head><meta charset="utf-8"><title>Type families</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:#FFFEFC;color:#1a1a1a;padding:20px;font-size:14px;}
  .block{margin-bottom:14px;}
  .label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#1B4332;margin-bottom:4px;}
  .specimen{font-size:22px;font-weight:600;letter-spacing:-0.01em;}
  .mono{font-family:'Geist Mono',ui-monospace,Menlo,monospace;font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;}
  small{color:#737373;font-size:11px;}
</style></head><body>
<div class="block">
  <div class="label">Inter · sans</div>
  <div class="specimen">ABCDEFGHIJKLMNÑOPQRSTUVWXYZ</div>
  <div class="specimen" style="font-weight:400;">abcdefghijklmnñopqrstuvwxyz</div>
  <small>400 · 500 · 600 · 700 — Google Fonts (pending licensed self-hosted files)</small>
</div>
<div class="block">
  <div class="label">Geist Mono · tabular numerics</div>
  <div class="mono">$ 1.234.567,89 · 15/03/2026 · 97,4 %</div>
  <small>Used for ledger amounts, dates, day-counts</small>
</div>
</body></html>
