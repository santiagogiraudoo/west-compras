<!doctype html><html><head><meta charset="utf-8"><title>Brand palette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:#FFFEFC;color:#1a1a1a;font-size:14px;padding:18px;}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
  .swatch{border-radius:6px;aspect-ratio:1.2/1;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;color:#fff;font-size:10px;font-weight:600;font-variant-numeric:tabular-nums;border:1px solid rgba(0,0,0,0.04);}
  .swatch .n{font-size:10px;opacity:0.85;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;}
  .swatch.light{color:#1a1a1a;}
</style></head><body>
<div class="grid">
  <div class="swatch" style="background:#1B4332"><span class="n">Primary</span>#1B4332</div>
  <div class="swatch" style="background:#2D6A4F"><span class="n">Green 2</span>#2D6A4F</div>
  <div class="swatch" style="background:#52796F"><span class="n">Green 3</span>#52796F</div>
  <div class="swatch" style="background:#74A892"><span class="n">Green 4</span>#74A892</div>
  <div class="swatch light" style="background:#95C4B0"><span class="n">Green 5</span>#95C4B0</div>
  <div class="swatch" style="background:#B8960C"><span class="n">Gold (10%)</span>#B8960C</div>
</div>
</body></html>
