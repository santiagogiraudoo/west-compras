<!doctype html><html><head><meta charset="utf-8"><title>Destino pills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:#FFFEFC;color:#1a1a1a;font-size:14px;padding:18px;}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:10px;font-size:11px;font-weight:500;}
  .pill svg{width:13px;height:13px;}
  .eyebrow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#1B4332;margin-bottom:8px;}
</style></head><body>
<div class="eyebrow">Destino pills · rounded-lg + lucide icon</div>
<div class="row">
  <span class="pill" style="background:#d1fae5;color:#065f46;"><i data-lucide="key"></i>Para alquiler</span>
  <span class="pill" style="background:#e0e7ff;color:#3730a3;"><i data-lucide="home"></i>Uso propio</span>
  <span class="pill" style="background:#e0f2fe;color:#075985;"><i data-lucide="hard-hat"></i>En construcción</span>
  <span class="pill" style="background:#fef3c7;color:#92400e;"><i data-lucide="mountain"></i>Sin desarrollar</span>
  <span class="pill" style="background:#ccfbf1;color:#115e59;"><i data-lucide="store"></i>Explotación propia</span>
  <span class="pill" style="background:#e7e5e4;color:#1c1917;"><i data-lucide="check-circle"></i>Vendida</span>
</div>
<script>lucide.createIcons();</script>
</body></html>
