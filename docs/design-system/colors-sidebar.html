<!doctype html><html><head><meta charset="utf-8"><title>Sidebar palette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:#FFFEFC;color:#1a1a1a;font-size:14px;padding:18px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .swatch{border-radius:6px;aspect-ratio:1.4/1;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-size:10px;font-weight:600;font-variant-numeric:tabular-nums;border:1px solid rgba(0,0,0,0.08);}
  .swatch .n{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;opacity:0.85;}
</style></head><body>
<div class="grid">
  <div class="swatch" style="background:oklch(0.25 0.055 163.7);color:oklch(0.92 0.010 163);"><span class="n">sidebar-bg</span>oklch(.25 .055 163.7)</div>
  <div class="swatch" style="background:oklch(0.32 0.060 163.7);color:oklch(0.95 0.008 163);"><span class="n">sidebar-accent</span>oklch(.32 .06 163.7)</div>
  <div class="swatch" style="background:oklch(0.35 0.050 163.7);color:#fff;"><span class="n">sidebar-border</span>oklch(.35 .05 163.7)</div>
  <div class="swatch" style="background:oklch(0.665 0.143 85.8);color:#1a1a1a;"><span class="n">sidebar-ring</span>oklch(.665 .143 85.8)</div>
</div>
</body></html>
