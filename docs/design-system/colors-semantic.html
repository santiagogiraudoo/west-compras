<!doctype html><html><head><meta charset="utf-8"><title>Status pills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:#FFFEFC;color:#1a1a1a;font-size:14px;padding:18px;}
  .group{margin-bottom:14px;}
  .group:last-child{margin-bottom:0;}
  .eyebrow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#737373;margin-bottom:8px;}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  /* Status pill · D — slate chip + 3px colored left accent */
  .pill{
    display:inline-flex;align-items:center;
    padding:2px 9px 2px 8px;
    border-radius:4px;
    font-size:11px;font-weight:500;
    background:#f5f5f0;
    color:#404040;
    border-left:3px solid;
  }
</style></head><body>

<div class="group">
  <div class="eyebrow">Rental status</div>
  <div class="row">
    <span class="pill" style="border-left-color:#10b981;">Ocupada</span>
    <span class="pill" style="border-left-color:#ef4444;">Libre</span>
  </div>
</div>

<div class="group">
  <div class="eyebrow">Contract status</div>
  <div class="row">
    <span class="pill" style="border-left-color:#0ea5e9;">Señado</span>
    <span class="pill" style="border-left-color:#10b981;">Activo</span>
    <span class="pill" style="border-left-color:#f97316;">Por vencer</span>
    <span class="pill" style="border-left-color:#f59e0b;">En liquidación</span>
    <span class="pill" style="border-left-color:#9ca3af;">Finalizado</span>
  </div>
</div>

<div class="group">
  <div class="eyebrow">Payment status</div>
  <div class="row">
    <span class="pill" style="border-left-color:#10b981;">Pagado</span>
    <span class="pill" style="border-left-color:#f59e0b;">Parcial</span>
    <span class="pill" style="border-left-color:#ef4444;">Pendiente</span>
  </div>
</div>

</body></html>
