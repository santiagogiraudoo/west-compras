<!doctype html><html><head><meta charset="utf-8"><title>Logos</title>
<style>
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:#FFFEFC;color:#1a1a1a;padding:20px;font-size:12px;display:flex;gap:20px;align-items:center;justify-content:space-around;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#1B4332;}
  .dark{background:oklch(0.32 0.06 163.7);padding:14px 22px;border-radius:6px;}
  img{display:block;}
  .sizeA img{max-height:56px;}
  .sizeB img{height:36px;}
  .sizeC img{height:40px;width:40px;object-fit:contain;}
</style></head><body>
<div class="cell sizeA"><img src="/docs/images/logo/Logo.png" alt=""><div class="lbl">Logo.png</div></div>
<div class="cell sizeB"><div class="dark"><img src="/docs/images/logo/Name.png" alt=""></div><div class="lbl">Name.png · on sidebar</div></div>
<div class="cell sizeC"><img src="/docs/images/logo/W.png" alt=""><div class="lbl">W.png · mark</div></div>
</body></html>
